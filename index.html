<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整合行銷工具盒 - QR Code 產生器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        /* 這裡就是你剛才提供的那一長串 CSS 精華 */
        @import "https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap";
        
        :root {
            --bg-color: #F7F8F7;
            --bg-gradient: linear-gradient(135deg, #F9FAFB 0%, #F3F4F6 100%);
            --surface-color: #FFFFFF;
            --primary-color: #2C3E50;
            --primary-light: #34495E;
            --accent-color: #7D9D89;
            --accent-glow: rgba(125, 157, 137, .3);
            --text-main: #333333;
            --text-secondary: #6B7280;
            --border-color: #E5E7EB;
            --radius-lg: 20px;
            --radius-sm: 8px;
            --shadow-xl: 0 24px 48px rgba(0, 0, 0, .12);
            --transition-normal: .3s cubic-bezier(.4, 0, .2, 1);
        }

        body {
            margin: 0;
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .main-content {
            width: 100%;
            max-width: 1000px;
            animation: slideUp 0.5s ease-out;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .content-card {
            background: var(--surface-color);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-color);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .grid-layout { grid-template-columns: 1fr; }
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            border-left: 4px solid var(--accent-color);
            padding-left: 12px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            transition: var(--transition-normal);
        }

        .btn-primary:hover { transform: translateY(-2px); opacity: 0.9; }

        .qr-preview-box {
            background: #f8fafb;
            padding: 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="main-content">
            
            <header class="header">
                <div class="logo">
                    <span>Marketing ToolBox</span>
                </div>
            </header>

            <div class="content-card">
                <div class="grid-layout">
                    
                    <div class="input-section">
                        <h3 class="section-title">QR Code 內容設定</h3>
                        <p style="color: var(--text-secondary); font-size: 14px;">請輸入你想轉換成 QR Code 的網址或文字：</p>
                        <input type="text" id="qr-input" placeholder="https://example.com" oninput="generateQR()">
                        
                        <div class="hint-text" style="margin-top: 20px;">
                            <small>💡 輸入內容後會自動即時產生</small>
                        </div>
                    </div>

                    <div class="preview-section">
                        <h3 class="section-title">即時預覽</h3>
                        <div class="qr-preview-box">
                            <div id="qrcode"></div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script>
        // 初始化 QR Code 產生器
        var qrcode = new QRCode(document.getElementById("qrcode"), {
            width: 200,
            height: 200
        });

        function generateQR() {
            var elText = document.getElementById("qr-input");
            if (!elText.value) {
                return;
            }
            qrcode.makeCode(elText.value);
        }

        // 預設產生一個內容
        qrcode.makeCode("https://github.com");
    </script>

</body>
</html>
<body>

<div class="d-flex" id="wrapper">
    <div id="sidebar-wrapper">
        <div class="sidebar-heading">工具箱</div>
        <div class="list-group list-group-flush">
            <a href="#" class="list-group-item list-group-item-action">QR Code 生成</a>
            <a href="#" class="list-group-item list-group-item-action">設定 (範例)</a>
            <a href="#" class="list-group-item list-group-item-action">關於</a>
        </div>
    </div>

    <div id="page-content-wrapper">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
            <div class="container-fluid">
                <button class="btn btn-outline-secondary btn-sm" id="menu-toggle">切換選單</button>
            </div>
        </nav>

        <div class="container-fluid py-4">
            <h2 class="mb-4">QR Code 生成器</h2>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="card shadow-sm mb-4">
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="text-input" class="form-label">輸入網址或文字</label>
                                <input type="text" class="form-control" id="text-input" placeholder="https://example.com" value="https://example.com">
                            </div>
                            <button id="generate-btn" class="btn btn-primary w-100">生成 QR Code</button>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6 text-center">
                    <div id="qrcode-container">
                        <div id="qrcode"></div>
                    </div>
                    <p class="mt-3 text-muted small">預覽區域</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 側邊欄切換邏輯
    window.addEventListener('DOMContentLoaded', event => {
        const sidebarToggle = document.body.querySelector('#menu-toggle');
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', event => {
                event.preventDefault();
                document.body.querySelector('#wrapper').classList.toggle('toggled');
            });
        }
    });

    // QR Code 生成邏輯
    const qrcodeElement = document.getElementById("qrcode");
    const textInput = document.getElementById("text-input");
    const generateBtn = document.getElementById("generate-btn");

    // 初始化生成一個
    const qrcode = new QRCode(qrcodeElement, {
        text: textInput.value,
        width: 200,
        height: 200,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });

    // 點擊按鈕更新
    generateBtn.addEventListener("click", () => {
        const value = textInput.value.trim();
        if (value) {
            qrcode.clear(); // 清除舊的
            qrcode.makeCode(value); // 生成新的
        } else {
            alert("請輸入內容");
        }
    });
</script>

</body>
</html>
