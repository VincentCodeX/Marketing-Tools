<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整合行銷工具盒</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary: #2C3E50;    /* 深藍色 */
            --bg: #F3F4F6;         /* 淺灰背景 */
            --white: #FFFFFF;
            --text: #374151;
            --border: #E5E7EB;
            --active-bg: #2C3E50;
            --active-text: #FFFFFF;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary);
            letter-spacing: 1px;
        }

        /* --- 1. 導覽列設計 (仿照你的截圖) --- */
        .nav-container {
            background: var(--white);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            gap: 8px;
            flex-wrap: wrap; /* 手機版自動換行 */
            justify-content: center;
            margin-bottom: 24px;
            max-width: 1000px;
            width: 100%;
        }

        .nav-btn {
            border: none;
            background: transparent;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #6B7280;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            flex: 1; /* 讓按鈕平均分配寬度 */
            min-width: 110px; /* 最小寬度 */
            justify-content: center;
        }

        .nav-btn:hover {
            background-color: #F3F4F6;
        }

        /* 啟動狀態的按鈕樣式 */
        .nav-btn.active {
            background-color: var(--active-bg);
            color: var(--active-text);
            box-shadow: 0 4px 6px -1px rgba(44, 62, 80, 0.4);
        }

        .nav-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor; /* 讓圖示顏色跟隨文字 */
            stroke-width: 2;
            fill: none;
        }

        /* --- 2. 主要內容卡片 --- */
        .main-card {
            background: var(--white);
            width: 100%;
            max-width: 1000px;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            min-height: 500px;
        }

        /* 隱藏未選中的區塊 */
        .tool-section {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }
        .tool-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- QR Code 區塊樣式 --- */
        .qr-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .input-group input:focus { outline: none; border-color: var(--primary); }

        .preview-box {
            background: #F8FAFB;
            border: 1px dashed var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            height: 100%;
        }

        /* 通用：功能開發中畫面 */
        .empty-state {
            text-align: center;
            padding: 60px 0;
            color: #9CA3AF;
        }
    </style>
</head>
<body>

    <h1 class="header-title">整合行銷工具盒</h1>

    <div class="nav-container">
        <button class="nav-btn active" onclick="switchTab('qr')">
            <svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            製作 QR Code
        </button>
        <button class="nav-btn" onclick="switchTab('gtm')">
            <svg viewBox="0 0 24 24"><path d="M2 12h20M2 12l4-4m-4 4l4 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            GTM 追蹤
        </button>
        <button class="nav-btn" onclick="switchTab('url')">
            <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" stroke-linecap="round" stroke-linejoin="round"/></svg>
            短網址產生
        </button>
        <button class="nav-btn" onclick="switchTab('img')">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            圖片壓縮
        </button>
        <button class="nav-btn" onclick="switchTab('ocr')">
            <svg viewBox="0 0 24 24"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3M9 11h6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            名片掃描 OCR
        </button>
        <button class="nav-btn" onclick="switchTab('ads')">
            <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            廣告規格
        </button>
        <button class="nav-btn" onclick="switchTab('emoji')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            符號 & Emoji
        </button>
    </div>

    <div class="main-card">
        
        <div id="tab-qr" class="tool-section active">
            <div class="qr-layout">
                <div>
                    <h2 style="margin-top:0; color:var(--primary);">製作 QR Code</h2>
                    <div class="input-group">
                        <label>輸入網址</label>
                        <input type="text" id="qr-input" placeholder="https://example.com" oninput="generateQR()">
                    </div>
                    <p style="color:#6B7280; font-size:14px;">輸入內容後，右側將自動生成。</p>
                </div>
                <div class="preview-box">
                    <div id="qrcode"></div>
                    <p style="margin-top:20px; font-size:14px; color:#6B7280;">即時預覽</p>
                </div>
            </div>
        </div>

        <div id="tab-gtm" class="tool-section">
            <div class="empty-state">
                <h2>GTM 追蹤碼生成器</h2>
                <p>功能開發中...</p>
            </div>
        </div>

        <div id="tab-url" class="tool-section">
            <div class="empty-state">
                <h2>短網址產生器</h2>
                <p>功能開發中...</p>
            </div>
        </div>

        <div id="tab-img" class="tool-section">
            <div class="empty-state">
                <h2>圖片壓縮工具</h2>
                <p>功能開發中...</p>
            </div>
        </div>

        <div id="tab-ocr" class="tool-section">
            <div class="empty-state">
                <h2>OCR 文字辨識</h2>
                <p>功能開發中...</p>
            </div>
        </div>

        <div id="tab-ads" class="tool-section">
            <div class="empty-state">
                <h2>社群廣告規格表</h2>
                <p>功能開發中...</p>
            </div>
        </div>

        <div id="tab-emoji" class="tool-section">
            <div class="empty-state">
                <h2>符號與 Emoji 庫</h2>
                <p>功能開發中...</p>
            </div>
        </div>

    </div>

    <script>
        // 1. 分頁切換邏輯
        function switchTab(tabId) {
            // 移除所有按鈕的 active 樣式
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            // 隱藏所有內容區塊
            document.querySelectorAll('.tool-section').forEach(section => section.classList.remove('active'));

            // 為點擊的按鈕加上 active
            event.currentTarget.classList.add('active');
            // 顯示對應的內容區塊
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        // 2. QR Code 生成邏輯
        var qrcode = new QRCode(document.getElementById("qrcode"), {
            width: 180,
            height: 180
        });

        function generateQR() {
            var elText = document.getElementById("qr-input");
            if (!elText.value) return;
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: elText.value,
                width: 180,
                height: 180
            });
        }
        
        // 預設生成
        qrcode.makeCode("https://github.com");
    </script>

</body>
</html>
