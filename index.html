<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整合行銷工具盒 - QR Code 產生器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        /* 引入字型 */
        @import "https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap";
        
        /* 定義變數 (顏色與風格) */
        :root {
            --bg-gradient: linear-gradient(135deg, #F9FAFB 0%, #F3F4F6 100%);
            --surface-color: #FFFFFF;
            --primary-color: #2C3E50;
            --primary-light: #34495E;
            --accent-color: #7D9D89;
            --text-main: #333333;
            --text-secondary: #6B7280;
            --border-color: #E5E7EB;
            --radius-lg: 20px;
            --radius-sm: 8px;
            --shadow-xl: 0 24px 48px rgba(0, 0, 0, .12);
        }

        /* 基礎設定 */
        body {
            margin: 0;
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .main-content {
            width: 100%;
            max-width: 1000px;
            animation: slideUp 0.5s ease-out;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .content-card {
            background: var(--surface-color);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-color);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .grid-layout { grid-template-columns: 1fr; }
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            border-left: 4px solid var(--accent-color);
            padding-left: 12px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            box-sizing: border-box; /* 修正輸入框寬度問題 */
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            transition: 0.3s;
        }

        .btn-primary:hover { transform: translateY(-2px); opacity: 0.9; }

        .qr-preview-box {
            background: #f8fafb;
            padding: 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="main-content">
            
            <header class="header">
                <div class="logo">
                    <span>Marketing ToolBox</span>
                </div>
            </header>

            <div class="content-card">
                <div class="grid-layout">
                    
                    <div class="input-section">
                        <h3 class="section-title">QR Code 內容設定</h3>
                        <p style="color: var(--text-secondary); font-size: 14px;">請輸入你想轉換成 QR Code 的網址或文字：</p>
                        <input type="text" id="qr-input" placeholder="https://example.com" oninput="generateQR()">
                        
                        <div class="hint-text" style="margin-top: 20px;">
                            <small>💡 輸入內容後，右側會自動即時產生</small>
                        </div>
                    </div>

                    <div class="preview-section">
                        <h3 class="section-title">即時預覽</h3>
                        <div class="qr-preview-box">
                            <div id="qrcode"></div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script>
        // 初始化 QR Code 產生器
        var qrcode = new QRCode(document.getElementById("qrcode"), {
            width: 200,
            height: 200
        });

        // 產生 QR Code 的功能
        function generateQR() {
            var elText = document.getElementById("qr-input");
            if (!elText.value) {
                // 如果是空的，就清空 QR Code 或不做事
                // 為了美觀，我們可以讓它保持最後一個狀態或顯示預設
                return;
            }
            // 清除舊的，產生新的
            document.getElementById("qrcode").innerHTML = ""; 
            new QRCode(document.getElementById("qrcode"), {
                text: elText.value,
                width: 200,
                height: 200
            });
        }

        // 網頁載入時，預設顯示 GitHub 網址
        generateQR(); // 先執行一次空的檢查
        // 手動設定預設值
        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
            text: "https://github.com",
            width: 200,
            height: 200
        });
    </script>

</body>
</html>
