<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code 生成器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            overflow-x: hidden;
            background-color: #f8f9fa;
        }
        /* 側邊欄樣式 */
        #sidebar-wrapper {
            min-height: 100vh;
            width: 250px;
            margin-left: -250px;
            transition: margin 0.25s ease-out;
            background-color: #343a40;
        }
        #sidebar-wrapper .sidebar-heading {
            padding: 1.5rem 1.25rem;
            font-size: 1.2rem;
            color: white;
            border-bottom: 1px solid #495057;
        }
        #sidebar-wrapper .list-group {
            width: 250px;
        }
        #wrapper.toggled #sidebar-wrapper {
            margin-left: 0;
        }
        .list-group-item {
            background-color: transparent;
            color: #adb5bd;
            border: none;
            padding: 1rem 1.5rem;
        }
        .list-group-item:hover {
            background-color: #495057;
            color: white;
        }
        /* 內容區域 */
        #page-content-wrapper {
            min-width: 100vw;
        }
        #wrapper.toggled #page-content-wrapper {
            padding-left: 250px;
        }
        @media (min-width: 768px) {
            #sidebar-wrapper { margin-left: 0; }
            #page-content-wrapper { min-width: 0; width: 100%; }
            #wrapper.toggled #sidebar-wrapper { margin-left: -250px; }
        }
        /* QR Code 顯示區域 */
        #qrcode-container {
            padding: 20px;
            background: white;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="d-flex" id="wrapper">
    <div id="sidebar-wrapper">
        <div class="sidebar-heading">工具箱</div>
        <div class="list-group list-group-flush">
            <a href="#" class="list-group-item list-group-item-action">QR Code 生成</a>
            <a href="#" class="list-group-item list-group-item-action">設定 (範例)</a>
            <a href="#" class="list-group-item list-group-item-action">關於</a>
        </div>
    </div>

    <div id="page-content-wrapper">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
            <div class="container-fluid">
                <button class="btn btn-outline-secondary btn-sm" id="menu-toggle">切換選單</button>
            </div>
        </nav>

        <div class="container-fluid py-4">
            <h2 class="mb-4">QR Code 生成器</h2>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="card shadow-sm mb-4">
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="text-input" class="form-label">輸入網址或文字</label>
                                <input type="text" class="form-control" id="text-input" placeholder="https://example.com" value="https://example.com">
                            </div>
                            <button id="generate-btn" class="btn btn-primary w-100">生成 QR Code</button>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6 text-center">
                    <div id="qrcode-container">
                        <div id="qrcode"></div>
                    </div>
                    <p class="mt-3 text-muted small">預覽區域</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 側邊欄切換邏輯
    window.addEventListener('DOMContentLoaded', event => {
        const sidebarToggle = document.body.querySelector('#menu-toggle');
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', event => {
                event.preventDefault();
                document.body.querySelector('#wrapper').classList.toggle('toggled');
            });
        }
    });

    // QR Code 生成邏輯
    const qrcodeElement = document.getElementById("qrcode");
    const textInput = document.getElementById("text-input");
    const generateBtn = document.getElementById("generate-btn");

    // 初始化生成一個
    const qrcode = new QRCode(qrcodeElement, {
        text: textInput.value,
        width: 200,
        height: 200,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });

    // 點擊按鈕更新
    generateBtn.addEventListener("click", () => {
        const value = textInput.value.trim();
        if (value) {
            qrcode.clear(); // 清除舊的
            qrcode.makeCode(value); // 生成新的
        } else {
            alert("請輸入內容");
        }
    });
</script>

</body>
</html>
